name: Plume (fka Plume Design)
description: >-
  Plume (formerly Plume Design) is a cloud-based smart-home and network-services
  platform for internet service providers (ISPs). Its products — Plume Home for
  residential WiFi, security and parental controls, WorkPass for small business,
  Uprise for multi-dwelling units, and the Haystack and Sweepr operations and
  support tools — reach hundreds of ISPs and millions of homes worldwide. Plume
  also stewards OpenSync, an open-source software-defined-networking framework
  whose Northbound APIs let ISPs build their own cloud and applications across a
  variety of CPE and consumer networking devices. Public developer access is
  partner-gated through the OpenSync certified-partner program rather than an open
  public API; there is no published public OpenAPI specification.
